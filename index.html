<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d2b2a;--mute:#6b7775;--line:#dcd9d1;--acc:#0f6b5c;--accink:#fff;--danger:#b3372f;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--ink:#e8eeec;--mute:#93a29e;--line:#2e3a36;--acc:#3fb59f;--accink:#08201b;--danger:#ef7d74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--ink:#e8eeec;--mute:#93a29e;--line:#2e3a36;--acc:#3fb59f;--accink:#08201b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;font-weight:800;margin:4px 0 12px}
input,button{font:inherit;color:inherit}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:8px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px}
button.main{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.del{color:var(--danger);border:0;background:none;padding:4px 8px}
.place{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.place h2{font-size:1.1rem;margin:0 0 6px;font-weight:800}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.row .who{flex:1}
.row small{color:var(--mute);display:block}
a.btn{display:inline-block;text-decoration:none;background:var(--acc);color:var(--accink);padding:7px 14px;border-radius:8px;font-weight:600;white-space:nowrap}
a.map{display:inline-block;margin:2px 0 8px;color:var(--acc);font-weight:600}
.num{direction:ltr;unicode-bidi:embed;display:inline-block}
.form{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:6px}

.tools{display:flex;gap:8px;margin-top:16px}
.wm{position:fixed;inset:0;pointer-events:none;z-index:3;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27240%27%20height%3D%27160%27%3E%3Ctext%20x%3D%27120%27%20y%3D%2785%27%20text-anchor%3D%27middle%27%20font-size%3D%2724%27%20font-weight%3D%27bold%27%20transform%3D%27rotate%28-25%20120%2080%29%27%20fill%3D%27%23808080%27%20fill-opacity%3D%270.2%27%20font-family%3D%27Cairo%2CTahoma%2CArial%2Csans-serif%27%3E%D9%85%D8%B5%D8%B7%D9%81%D9%89%20%D8%B9%D9%84%D8%A7%D8%A1%3C%2Ftext%3E%3C%2Fsvg%3E");background-repeat:repeat}.wa-fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;background:#1f8f4d;color:#fff;text-decoration:none;font-weight:700;padding:11px 16px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.3)}#msg{bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}</style>
